# =============================================================================
# Cook Agent CI
#
# 流水线：
#   backend  job: lint（ruff bug 级规则）→ 单元测试（135+）→ RAG/任务集校验
#                → 任务评测回归门禁（配置 LLM_API_KEY secret 后启用）
#   frontend job: npm ci → 类型检查（tsc -b）→ 生产构建（vite build）
#
# 本地复现：
#   pip install -r requirements-dev.txt
#   ruff check app/ tests/ scripts/
#   pytest tests/ -q --ignore=tests/test_mcp.py
#   cd frontend && npm ci && npx tsc --noEmit && npm run build
# =============================================================================
name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests + eval gates)
    runs-on: ubuntu-latest
    env:
      # 测试用 SQLite（session 模块级读取）
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (bug-level rules)
        run: ruff check app/ tests/ scripts/

      - name: Unit tests
        run: pytest tests/ -q --ignore=tests/test_mcp.py

      - name: RAG testsets validate (dry-run)
        run: python -m scripts.run_evaluation --dry-run

      - name: Agent task datasets validate (dry-run)
        run: python -m scripts.run_agent_evaluation --dry-run

      # 评测回归门禁：仅在配置了 LLM_API_KEY secret 时启用。
      # 首次运行自动生成基线；后续运行对比基线，完成率下降超阈值即失败。
      - name: Task evaluation regression gate
        if: env.LLM_API_KEY != ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python -m scripts.run_agent_evaluation \
            --save-baseline data/evaluation_reports/ci_baseline.json
          python -m scripts.run_agent_evaluation \
            --baseline data/evaluation_reports/ci_baseline.json \
            --fail-on-regression

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
